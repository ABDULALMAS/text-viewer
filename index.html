<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notes Viewer</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #12141a;
    --panel: #171a22;
    --line: #262a35;
    --text: #d4dae6;
    --dim: #6b7488;
    --head: #7cb7ff;
    --time: #f2b66d;
    --ok: #a5d68a;
    --mono: ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.65 var(--sans);
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
  }
  .bar {
    position: sticky; top: 0; z-index: 1;
    display: flex; justify-content: flex-end; gap: 6px;
    padding: 10px 16px;
    background: linear-gradient(var(--bg) 70%, transparent);
  }
  button {
    font: inherit; font-size: 12px; font-family: var(--mono);
    background: var(--panel); color: var(--dim);
    border: 1px solid var(--line); border-radius: 6px;
    padding: 4px 10px; cursor: pointer;
  }
  button:hover { color: var(--text); border-color: var(--dim); }
  button:focus-visible { outline: 2px solid var(--head); outline-offset: 1px; }

  #out { max-width: 760px; margin: 0 auto; padding: 8px 20px 80px; }
  .empty { color: var(--dim); font-family: var(--mono); font-size: 14px; padding-top: 12vh; text-align: center; }
  kbd {
    font: inherit; color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px;
  }

  h1 { font-size: 24px; line-height: 1.3; margin: 8px 0 8px; color: var(--text); }
  h2 {
    font: 600 13px/1.4 var(--mono); letter-spacing: .08em;
    color: var(--head); margin: 28px 0 6px;
    padding-bottom: 6px; border-bottom: 1px solid var(--line);
  }
  p, .li, .tm, .kv { margin: 0; }
  .gap { height: 8px; }
  .li { position: relative; padding-left: 1.3em; }
  .li::before { content: "•"; position: absolute; left: .35em; color: var(--dim); }
  .li.ok::before { content: "✓"; left: .2em; color: var(--ok); }
  .li.d1 { margin-left: 1.3em; } .li.d2 { margin-left: 2.6em; } .li.d3 { margin-left: 3.9em; }
  .tm { display: grid; grid-template-columns: 7.5em 1fr; gap: 0 12px; margin-top: 12px; font-weight: 600; }
  .tm .t { font: 500 13px/1.9 var(--mono); color: var(--time); }
  .kv .k { color: var(--dim); }
  code { font: 14px var(--mono); background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }

  @media (max-width: 520px) {
    .tm { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <div class="bar">
    <button id="paste" type="button">Paste</button>
    <button id="clear" type="button">Clear</button>
  </div>
  <div id="out"></div>

<script>
  const out = document.getElementById('out');

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  // Text with `inline code` support
  function inline(parent, text) {
    text.split(/(`[^`]+`)/).forEach(part => {
      if (!part) return;
      if (part.length > 2 && part[0] === '`' && part.endsWith('`')) parent.append(el('code', '', part.slice(1, -1)));
      else parent.append(part);
    });
    return parent;
  }

  const isCaps = s => s.length <= 70 && /[A-Z]{3}/.test(s) && s === s.toUpperCase() && !/[.!?]$/.test(s);
  const TIME = /^(\d{1,2}:\d{2})\s*[–-]\s*(\d{1,2}:\d{2})\s*[—–:-]\s*(.*)$/;
  const BULLET = /^(\s*)[*\-•]\s+(.*)$/;
  const CHECK = /^(\s*)[✓✔☑]\s*(.*)$/;
  const LABEL = /^([A-Za-z][A-Za-z ]{0,18}):\s+(.+)$/;

  function depth(ws) { return Math.min(3, Math.floor(ws.replace(/\t/g, '  ').length / 2)); }

  function render(text) {
    out.replaceChildren();
    const lines = text.replace(/\r/g, '').split('\n');
    let first = true, lastGap = true;

    for (const raw of lines) {
      const line = raw.replace(/\s+$/, '');
      const s = line.trim();

      if (!s) {
        if (!lastGap) out.append(el('div', 'gap'));
        lastGap = true;
        continue;
      }
      lastGap = false;
      let m;

      if ((m = s.match(/^#{1,6}\s+(.*)$/))) {
        out.append(first ? el('h1', '', m[1]) : el('h2', '', m[1]));
      } else if (isCaps(s)) {
        out.append(first ? el('h1', '', s) : el('h2', '', s));
      } else if ((m = s.match(TIME))) {
        const row = el('div', 'tm');
        row.append(el('span', 't', `${m[1]}–${m[2]}`), inline(el('span'), m[3]));
        out.append(row);
      } else if ((m = line.match(CHECK))) {
        out.append(inline(el('div', 'li ok d' + depth(m[1])), m[2]));
      } else if ((m = line.match(BULLET))) {
        out.append(inline(el('div', 'li d' + depth(m[1])), m[2]));
      } else if ((m = s.match(LABEL))) {
        const kv = el('p', 'kv');
        kv.append(el('span', 'k', m[1] + ': '));
        inline(kv, m[2]);
        out.append(kv);
      } else {
        out.append(inline(el('p'), s));
      }
      first = false;
    }
  }

  function empty() {
    out.replaceChildren();
    const box = el('div', 'empty');
    box.append('Press ', el('kbd', '', 'Ctrl / ⌘ + V'), ' to paste your text');
    out.append(box);
  }

  // Paste anywhere on the page
  document.addEventListener('paste', e => {
    const text = e.clipboardData && e.clipboardData.getData('text');
    if (!text || !text.trim()) return;
    e.preventDefault();
    render(text);
    window.scrollTo(0, 0);
  });

  document.getElementById('paste').onclick = async () => {
    try {
      const text = await navigator.clipboard.readText();
      if (text.trim()) { render(text); window.scrollTo(0, 0); }
    } catch { /* clipboard blocked: Ctrl/Cmd+V still works */ }
  };
  document.getElementById('clear').onclick = empty;

  empty();
</script>
</body>
</html>
